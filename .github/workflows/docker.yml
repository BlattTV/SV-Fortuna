name: Docker Build & Push

on:
  push:
    branches: ["claude/sv-fortuna-website-otq2hh", "main"]

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/sv-fortuna

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/sv-fortuna:latest
            ghcr.io/${{ github.repository_owner }}/sv-fortuna:${{ github.sha }}
