# Portainer Stack – einfach in den Web Editor kopieren und deployen.
#
# Voraussetzung: Das GitHub Container Registry Image muss öffentlich sein.
# → github.com/blatttv?tab=packages → sv-fortuna → Package settings → Public
#
# SESSION_SECRET unbedingt ändern!
# Generieren: openssl rand -hex 32

services:
  web:
    image: ghcr.io/blatttv/sv-fortuna:latest
    ports:
      - "3000:3000"
    volumes:
      # SQLite-Datenbanken bleiben beim Neustart erhalten
      - sv_data:/app/data
    environment:
      NODE_ENV: production
      PORT: 3000
      # PFLICHT: Hier ein sicheres Secret eintragen!
      SESSION_SECRET: change-me-before-deploying
      # Auf "1" setzen wenn nginx/traefik mit HTTPS davor läuft
      TRUST_PROXY: ""
    restart: unless-stopped

volumes:
  sv_data:
